name: Bug report
description: Report reproducible incorrect behavior.
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the revision, commands, and minimal event sequence.
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Boundary impact
      description: Does this affect identity, approval, data ownership, audit, or model egress?
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
